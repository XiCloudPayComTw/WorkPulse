name: Build and deploy WorkPulse
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify

  # GitHub recommends finishing the Pages upload job before a separate deployment job.
  # This also ensures artifact indexing has time to become visible to the deployment API.
  build_pages:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.naming.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - uses: actions/configure-pages@v5
      - id: naming
        name: Set this upload attempt's unique artifact name
        run: echo "name=workpulse-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: ${{ steps.naming.outputs.name }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build_pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub may confirm an upload before its artifact listing API is consistent.
      # Fail with a precise error rather than immediately failing inside deploy-pages.
      - name: Wait until the uploaded artifact is discoverable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build_pages.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_NAME"
          for attempt in $(seq 1 20); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
                --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Verified Pages artifact: $ARTIFACT_NAME"
              exit 0
            fi
            echo "Artifact not listed yet (attempt $attempt/20); retrying in 3 seconds"
            sleep 3
          done
          echo "::error::Pages artifact $ARTIFACT_NAME was uploaded but is not visible through the Actions API"
          exit 1
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build_pages.outputs.artifact_name }}
